name=Idle Time Warning
description=Displays a warning when the user has been inactive for a configured period of time.

parameter.timeoutMinutes.name=Timeout (minutes)
parameter.timeoutMinutes.description=Total inactivity time in minutes before the user is considered idle. Set this to match the session timeout configured in the Admin Console.

parameter.warnBeforeMinutes.name=Warn Before (minutes)
parameter.warnBeforeMinutes.description=Number of minutes before the timeout when the warning should be shown.

parameter.showWarningValue.name=Show Warning
parameter.showWarningSaveInto.name=Show Warning Save Into
parameter.showWarning.description=Boolean flag indicating whether the inactivity warning should be displayed.

parameter.warningMessage.name=Warning Message
parameter.warningMessage.description=The custom text to display before the countdown clock.

parameter.showWarningSaveInto.name=Show Warning Save Into
parameter.showWarning.description=Boolean flag indicating whether the inactivity warning should be displayed.

parameter.activityPulse.name=Activity Pulse
parameter.activityPulse.description=Pass a changing value (like now()) from SAIL to reset the idle timer.