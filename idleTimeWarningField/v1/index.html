<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script src="APPIAN_JS_SDK_URI"></script>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }
      /* Base styles for the banner */
      #warning-banner {
        display: none; 
        padding: 15px;
        text-align: center;
        border-radius: 4px;
        font-weight: bold;
        font-size: 16px;
        transition: background-color 0.5s ease; /* Smooth color transition */
      }

      /* The "Standard" Skin */
      .standard-look {
        background-color: #fcb858; 
        color: #000000;
        border: 1px solid #d13535;
      }

      /* The "Hot" Skin */
      .hot-look {
        background-color: #d13535; 
        color: #f8e8ec;
        border: 2px solid #000000;
      }
      #timer {
        font-family: monospace;
        font-size: 18px;
      }
    </style>
    <script>
      (function () {
        var lastActivityTime = Date.now();
        var warningThresholdMs = null;
        var hotWarningThresholdMs = null;
        var absoluteTimeoutMs = null;
        var checkIntervalId = null;
        var isWarningActive = false;
        var activityPulse = null;
        
        // 1. Set a fallback default message just in case the Appian developer leaves it blank
        var defaultMessage = "Warning: You will be logged out due to inactivity in ";

        // Function to reset variables in case of user activity (user activity is described below)
        function resetActivity() {
          lastActivityTime = Date.now();
          if (isWarningActive) {
            var banner = document.getElementById("warning-banner");
            banner.style.display = "none";
            banner.className = "standard-look"; // Reset to default skin
            Appian.Component.saveValue("showWarning", false);
            isWarningActive = false;
          }
        }
        // Function to start a timer for user inactivity - first deleting existing timers - then timer logic
        function startInactivityTimer() {
          if (checkIntervalId !== null) {
            clearInterval(checkIntervalId);
          }
          // Function to start a timer for user inactivity, running every 1000ms (1 sec)
          checkIntervalId = setInterval(function () {
            if (warningThresholdMs == null || absoluteTimeoutMs == null) return;

            var now = Date.now();
            var inactiveMs = now - lastActivityTime;
            var banner = document.getElementById("warning-banner");
            var timerSpan = document.getElementById("timer");
            // checking if idle time passes given limit (timeoutMinutes - warnBeforeMinutes), if so show warning banner
            if (inactiveMs >= warningThresholdMs) {
              banner.style.display = "block";
              isWarningActive = true;
              Appian.Component.saveValue("showWarning", true);
              // checking if there is less or equal to 30 sec left until timeOut, to obtain special warning banner 
              if (inactiveMs >= hotWarningThresholdMs) {
                banner.className = "hot-look"
              } else {
                banner.className = "standard-look"
              }

              var timeLeftMs = absoluteTimeoutMs - inactiveMs;
              // calculating timer to show in MM:SS (converted from raw ms) updating every second
              if (timeLeftMs <= 0) {
                timerSpan.innerText = "00:00";
              } else {
                var totalSeconds = Math.floor(timeLeftMs / 1000);
                var minutes = Math.floor(totalSeconds / 60);
                var seconds = totalSeconds % 60;
                timerSpan.innerText = (minutes < 10 ? "0" : "") + minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
              }
            }
          }, 1000); 
        }

        // Listen for the new warningMessage/timeoutMinutes/warnBeforeMinutes parameter from Appian
        Appian.Component.onNewValue(function (newValues) {
          
          // 1. Listen for the external pulse from Appian
          // If this value changes, the user did something outside the iframe!
          if (newValues.activityPulse) {
            resetActivity();
          }

          // 2. Handle the warning message (from our previous fix)
          var customMessage = newValues.warningMessage || defaultMessage;
          document.getElementById("message-text").innerText = customMessage;

          // 3. Handle the thresholds
          var timeoutMinutes = newValues.timeoutMinutes;
          var warnBeforeMinutes = newValues.warnBeforeMinutes;

          if (timeoutMinutes && warnBeforeMinutes) {
            absoluteTimeoutMs = timeoutMinutes * 60 * 1000;
            warningThresholdMs = (timeoutMinutes - warnBeforeMinutes) * 60 * 1000;
            hotWarningThresholdMs = (timeoutMinutes - 0.5) * 60 * 1000;
          }

          // Start or restart the timer
          startInactivityTimer();
        });

        window.addEventListener("mousemove", resetActivity);
        window.addEventListener("keydown", resetActivity);
        window.addEventListener("click", resetActivity);
      })();
    </script>
  </head>
  <body>
    <div id="warning-banner" class="standard-look">
      <span id="message-text"></span>
      <span id="timer">00:00</span>
    </div>
  </body>
</html>
